name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[fal,timeline,dev]'
      # Scope lint to the new exporter and tests. The existing repository-wide
      # Ruff backlog is unrelated to this storyboard export PR.
      - run: ruff check src/forge_studios/storyboard_export.py src/forge_studios/media_types.py src/forge_studios/ai_runtime.py src/forge_studios/asset_resolution.py src/forge_studios/runtime_preflight.py src/forge_studios/image_compare.py tests/current/test_storyboard_export.py tests/current/test_image_compare.py tests/current/test_runtime_preflight.py
      - run: pytest -q
