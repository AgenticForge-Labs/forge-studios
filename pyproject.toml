[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-studios"
version = "0.1.0"
description = "Open production runtime for synthetic, physical, and hybrid AgenticForge episodes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "platformdirs>=4.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
fal = ["fal-client>=0.7"]
timeline = ["opentimelineio>=0.17"]
visual = ["opencv-python-headless>=4.10", "numpy>=1.26"]
secrets = ["keyring>=25"]
dev = ["pytest>=8", "ruff>=0.6"]
full = ["fal-client>=0.7", "opentimelineio>=0.17", "opencv-python-headless>=4.10", "numpy>=1.26", "keyring>=25"]

[project.scripts]
forge-studios = "forge_studios.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
