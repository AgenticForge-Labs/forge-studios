[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-studios"
version = "0.1.0"
description = "Open production runtime for synthetic, physical, and hybrid AgenticForge episodes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
fal = ["fal-client>=0.7"]
secrets = ["keyring>=25"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
forge-studios = "forge_studios.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
